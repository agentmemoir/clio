# Check the full resolved graph, including optional features and all targets.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

# ring is the only crypto provider for this workspace's TLS: rustls and
# rustls-webpki resolve to it, and the aws-lc-rs features stay off. ring
# 0.17.14 has had no release since 2025-03-11, so a future RUSTSEC fix
# would arrive only when upstream publishes one. Keep it monitored instead
# of migrating now: aws-lc-rs needs a C and C++ toolchain on every target,
# on top of the C step SQLite already requires. A vulnerability or
# unmaintained advisory against ring fails the dependency policy job that
# runs this file every week, and that failure is the trigger to revisit
# the choice. Upstream state as of 2026-11-04. Recorded from issue #366.

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
