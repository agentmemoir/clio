[package]
name = "clio-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP tool schemas and transport bindings for the write surface"

[dependencies]
clio-admission = { workspace = true }
clio-belief = { workspace = true }
clio-compliance = { workspace = true }
clio-hygiene = { workspace = true }
clio-config = { workspace = true }
clio-history = { workspace = true }
clio-index = { workspace = true }
clio-ops = { workspace = true }
clio-persona = { workspace = true }
clio-retrieve = { workspace = true }
clio-store = { workspace = true }
clio-sync = { workspace = true }
clio-types = { workspace = true }
clio-write = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
clio-types = { workspace = true }

[dev-dependencies]
# Schema-pack tests compile every emitted schema offline, so a reference that
# only resolves over the network fails the suite instead of a client.
jsonschema = { version = "0.60.2", default-features = false }
# Sealing in these tests uses the process test key, so they never reach the
# machine's real key store; without the feature a developer machine holding both
# a keystore entry and a key file fails every seal with the two-store refusal.
clio-config = { workspace = true, features = ["test-key-injection"] }
# The Postgres suites route their configured-URL gate through the store's
# test-support seam, which only a dev-dependency turns on.
clio-store = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
