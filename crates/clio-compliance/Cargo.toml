[package]
name = "clio-compliance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Audit trail reconstruction, memory inspector support, and auditable correction"

[dependencies]
clio-types = { workspace = true }
clio-config = { workspace = true }
clio-admission = { workspace = true }
clio-belief = { workspace = true }
clio-store = { workspace = true }
clio-write = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
# The Postgres test suites route their opt-out and fail-closed decision through
# the store's test-support seam, which only a dev-dependency turns on.
clio-store = { workspace = true, features = ["test-support"] }

