[package]
name = "clio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Clio durable memory for long-horizon agents and companion chat (by Agent Memoir)"

[[bin]]
name = "clio"
path = "src/main.rs"

[dependencies]
clio-types = { workspace = true }
clio-config = { workspace = true }
clio-backup = { workspace = true }
clio-compliance = { workspace = true }
clio-store = { workspace = true }
clio-admission = { workspace = true }
clio-write = { workspace = true }
clio-belief = { workspace = true }
clio-persona = { workspace = true }
clio-index = { workspace = true }
clio-ops = { workspace = true }
clio-retrieve = { workspace = true }
clio-history = { workspace = true }
clio-hygiene = { workspace = true }
clio-mcp = { workspace = true }
# `sync serve` starts the deployment's server itself so the process can be
# served through the denial-aware entry point with the erasure-journal probe;
# the crate is already in this binary's build graph through `clio-mcp`.
clio-sync = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anstyle = { workspace = true }
cliclack = { workspace = true }
# The one random source in the workspace, already used by the encryption-key
# code. `clio setup` generates a database password with the same call rather
# than adding a second generator.
rand = { workspace = true }
# Masks the typed database password and API keys. Hand-rolling terminal echo
# control is not possible under the workspace's `unsafe_code = "deny"`, so this
# is the whole of the raw-terminal surface, behind a seam.
rpassword = { workspace = true }
# Raw read-only SQL over an archive's payload and key-store members, so the
# restore authority check can read subject references the store API does not
# expose. Already in the workspace through `clio-store`; promoted here because
# the check runs in the binary.
rusqlite = { workspace = true }
# `clio setup` downloads the extract model itself rather than printing a command,
# so the binary streams one HTTPS response to disk. Already in the workspace
# through `clio-index`; promoted here for that download.
ureq = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The one signal the process sets itself: restoring the default `SIGPIPE`
# disposition so a closed stdout ends the process quietly. Rust installs
# `SIG_IGN` at startup, which turns a broken pipe into an `EPIPE` error that
# `println!` panics on. Unix-only, so the dependency is target-scoped.
libc = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The deployment config seals its secrets, so a test that runs `clio setup` or
# `config set` at deployment scope needs a Clio encryption key. The feature
# compiles in the test-only injection seam; without it such a test would fall
# through to the machine's real key store.
clio-config = { workspace = true, features = ["test-key-injection"] }
# The Postgres integration harnesses route their opt-out and target description
# through the store's test-support seam, which only a dev-dependency turns on.
clio-store = { workspace = true, features = ["test-support"] }
