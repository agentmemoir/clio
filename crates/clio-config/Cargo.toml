[package]
name = "clio-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Config loading, profiles, ranking env, and secret masking for Agent Memoir"

[features]
# Compiles the test-only key-injection seam into the library. Only a
# dev-dependency turns it on, so nothing in a shipped binary can make a running
# Clio seal a value under a key its operator did not create.
test-key-injection = []
# Runs the Linux round trip against a real Secret Service daemon, which needs a
# session bus the ordinary suite cannot assume. Off by default so the suite stays
# host-independent; the `linux-secret-service` CI job turns it on inside
# `dbus-run-session`.
linux-secret-service-test = []

[dependencies]
clio-types = { workspace = true }
# The secret envelope is one base64 string, so this is a runtime dependency now
# rather than a test-only one. A hand-rolled encoder could itself be wrong, which
# would make the leak assertions pass for the wrong reason.
base64 = { workspace = true }
# The one AEAD this project uses: content, the secret envelope, and the key store
# are all sealed with it, so there is no second algorithm to argue about.
chacha20poly1305 = { workspace = true }
# The entry type, the credential trait, and the error type every store below is
# reached through. The platform store is installed once per process, lazily on
# the first entry, by `secret_key_store`, from the target-scoped crate below.
keyring-core = { workspace = true }
# Only its `O_NOFOLLOW`, `O_NONBLOCK`, and `ELOOP` constants: the token store and
# the sync key files are opened without following a link, without blocking on a
# FIFO, and with the error that names a refused link. This crate forbids unsafe
# code, so no `libc` function is called. Unconditional because the workspace
# already carries it, and the `cfg(unix)` uses below pick it up from here.
libc = { workspace = true }
# The effective uid of the process, compared against the token store's and the
# sync key files' owner. A safe wrapper, unlike a direct `libc` call, which this
# crate cannot make.
rustix = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

# One platform store per target, each gated to the target that has it, so no
# build compiles a backend it cannot run.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true }

[lints]
workspace = true
