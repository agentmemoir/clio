[package]
name = "clio-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Dual-backend persistence, DEK interface, and vector storage hooks"

[dependencies]
clio-types = { workspace = true }
clio-config = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = { workspace = true }
pgvector = { workspace = true }
postgres = { workspace = true }
# Encrypted Postgres connections. The store holds the one connector decision
# (`pg_tls::connect`), so these are the only places TLS is chosen.
postgres_rustls = { workspace = true }
rand = { workspace = true }
rusqlite = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlite-vec = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }
zerocopy = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
clio-admission = { workspace = true }
# The key store seals per-subject keys, so a test that writes one needs a Clio
# encryption key. The feature compiles in the test-only injection seam; without
# it a test would fall through to the machine's real key store. It is a
# dev-dependency, so no shipped build has it.
clio-config = { workspace = true, features = ["test-key-injection"] }
