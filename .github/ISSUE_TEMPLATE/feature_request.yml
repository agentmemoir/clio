name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting. Search existing issues first to avoid duplicates.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it?
      placeholder: As a ..., I cannot ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include CLI surface or behavior if relevant.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Observable results if this ships. How would you verify it works?
      placeholder: |
        - ...
        - ...
  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: What is in scope, explicitly out of scope, and what must not change.
      value: |
        In scope:
        - ...

        Out of scope:
        - ...

        Must not change:
        - ...
      render: markdown
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable criteria that decide when this is done.
      placeholder: |
        - ...
        - ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches and why they fall short.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, related issues.
