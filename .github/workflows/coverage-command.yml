name: coverage-command

# A comment is the only way to ask for a full run, so `issue_comment` is
# required. Nothing from the comment reaches a shell: the gate job below reads
# only the author association, and it refuses every commenter who is not an
# owner, a member, or a collaborator.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers] the gate job admits trusted commenters only
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    name: Check the commenter may run full coverage
    if: startsWith(github.event.comment.body, '/coverage-full')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.trust.outputs.allowed }}
    steps:
      - name: Check the commenter relationship to the repository
        id: trust
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          set -euo pipefail
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  coverage:
    name: Full coverage
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    # The called workflow's report job writes an issue, and a called workflow
    # may only use permissions that the calling job grants it.
    permissions:
      contents: read
      issues: write
    uses: $/.github/workflows/coverage-full.yml
