name: External Contrib
on:
  # A fork PR needs a write to the target repository to be turned into a draft,
  # which `pull_request` cannot do. This workflow reads no PR content: it has no
  # checkout and one step that calls the GitHub API with the event's PR number.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, ready_for_review]
permissions:
  # `convertPullRequestToDraft` refuses the call with only `pull-requests: write`.
  contents: write
  pull-requests: write
jobs:
  draft-external:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, no PR-content evaluation, only GitHub API mutation.
      - name: Resolve whether the actor may keep the PR ready
        id: actor
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.sender.login }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          permission=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$permission" in
            admin|maintain|write) echo "maintainer=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "maintainer=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Convert external PR to draft
        if: steps.actor.outputs.maintainer != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        # A refused mutation reports one line and leaves the job green: a draft
        # conversion is a courtesy, not a merge gate.
        run: |
          if ! gh pr ready "$PR_NUMBER" --undo --repo "$GH_REPO"; then
            echo "Could not convert PR #$PR_NUMBER to draft: the API refused the mutation."
          fi
