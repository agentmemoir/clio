# The clio-bench harness is Python, and no Rust gate compiles a line of it, so
# the harness runs its own suite here. The path filters mirror ci.yml's rule:
# this workflow starts only when the benchmark tree itself changes, and a
# benchmarks-only change does not start the Rust jobs next door.
#
# Two jobs run. The `tests` job stays hermetic: no dataset is downloaded, and
# the live Mnemosyne tests skip when no binary is installed on the runner. The
# `budget` job is the opposite trade: it installs the pinned tokenizer, builds
# the CLI from source, then measures the MCP token budget twice with the
# network denied and requires the two runs to be byte-identical, because a
# measurement that cannot reproduce itself is not a measurement.
name: Benchmarks

on:
  push:
    branches: [master, main]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/mcp_token_budget.sh'
  pull_request:
    branches: [master, main]
    paths:
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/mcp_token_budget.sh'

permissions:
  contents: read

jobs:
  tests:
    name: clio-bench suite (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the benchmark suite
        run: python3 -m unittest discover -s benchmarks/tests -t .

  budget:
    name: mcp token budget (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the pinned tokenizer
        run: python3 -m pip install --disable-pip-version-check --requirement benchmarks/mcp_token_budget/requirements.txt

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the CLI
        run: cargo build --locked -p clio --bin clio

      - name: Run the budget tests
        run: python3 -m unittest discover -s benchmarks/mcp_token_budget -p 'test_*.py' -t . -v

      - name: Measure twice with the network denied
        run: |
          export HTTP_PROXY=http://127.0.0.1:1
          export HTTPS_PROXY=http://127.0.0.1:1
          export ALL_PROXY=http://127.0.0.1:1
          export NO_PROXY=
          scripts/mcp_token_budget.sh > "$RUNNER_TEMP/budget-a.json"
          scripts/mcp_token_budget.sh > "$RUNNER_TEMP/budget-b.json"
          cmp "$RUNNER_TEMP/budget-a.json" "$RUNNER_TEMP/budget-b.json"
          cat "$RUNNER_TEMP/budget-a.json"
