# CI: format, clippy, and the tests and coverage of what a change touches.
#
# The suite is scoped. `make coverage-fast` runs the tests of the packages a
# change can affect and judges the changed files against a ≥80% line floor. It
# does not measure the workspace, so it cannot report on a file nobody touched.
#
# What that buys and what it costs are both real, so both are written down here
# rather than left to be discovered:
#
#   buys: a change to one leaf crate is judged in minutes instead of the hour
#         the full-workspace instrumented build needed, and the gate stops
#         failing on coverage debt in files the change never went near.
#   costs: a test that breaks in a crate the change does not reach will not be
#          caught here. The closure is the crate plus every crate that depends on
#          it, which is where a signature change shows up, but a defect that
#          needs an unrelated crate's tests to surface is no longer CI's job.
#
# The gate itself is `scripts/scoped_runner.py`, and it is the only test run: a
# plain `make test-fast` over the same selection would put the suite through the
# runner a second time for one pull request, so CI leaves it to developers.
#
# The pinned MCP conformance suite is a workflow of its own,
# `.github/workflows/mcp-conformance.yml`, gated by a path filter instead of by a
# step here that asks git what changed. Keeping it out of this file is also what
# keeps this file inside the size its own rules expect.
name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  CLIO_DATABASE_URL: postgres://clio:clio@127.0.0.1:5432/clio
  # Build parallelism, capped so the gate survives a small runner.
  #
  # A single rustc peaks around 386MB RSS on this workspace, so cargo's default of
  # one compiler per core needs roughly 772MB on a 2-core runner and gets
  # OOM-killed partway through the instrumented build. One compiler at a time
  # fits. The wall-clock cost is bounded because the instrumented build is cached
  # between runs, so only changed crates are recompiled.
  CARGO_BUILD_JOBS: "1"

permissions:
  contents: read

jobs:
  check:
    name: fmt · clippy · script suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clio
          POSTGRES_PASSWORD: clio
          POSTGRES_DB: clio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clio -d clio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      # Full history, not the default shallow clone. The scoped runner works out
      # what a change touched by asking git for the merge base with the base
      # branch, and a depth-1 clone has no base branch to find: the query fails,
      # the runner treats the missing base as "measure everything", and the job
      # silently turns back into the full-workspace gate this file exists to
      # avoid. This is the one checkout setting the scoped gate depends on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # What the scoped changelog check measures against, and the exact spelling
      # of it matters. A pull request is checked out in detached HEAD mode, so
      # there is no local branch for the base at all -- only
      # refs/remotes/origin/<base>. Passing the bare name `master` there is an
      # unresolvable ref, and the runner treats an unresolvable base as an error
      # rather than as an empty scope, so every pull request would fail on a
      # typo-shaped mistake. `origin/<base>` is the form that resolves on a
      # runner and on a laptop alike. A push to master has no base branch, and
      # `origin/HEAD~1` is not a ref, so that case uses the previous commit
      # directly: it keeps master honest about what it just merged rather than
      # diffing master against itself and judging nothing.
      - name: Resolve the diff base
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            echo "SCOPED_BASE=origin/$GITHUB_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "SCOPED_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
          echo "measuring against: ${GITHUB_BASE_REF:+$GITHUB_BASE_REF (remote form)}"

      # Build-free and seconds long: an over-long file fails here before the
      # toolchain is installed, so the job stops at the cheapest gate.
      - name: Line limit (450)
        run: make llc

      # The exact version, taken from the pin rather than from the `stable`
      # channel. Naming it here as well is deliberate: the action's own
      # documentation says an explicit input can override the toolchain file,
      # and a second project found the opposite. Setting both removes the
      # question. The step after this one fails the job if the two ever drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Fail if the runner and the pin disagree
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::runner has rustc $actual but rust-toolchain.toml pins $pinned"
            exit 1
          fi
          echo "rustc $actual matches the pin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Clippy stays workspace-wide. It compiles but does not run the tests, so it
      # is not the cost this workflow gave up, and scoping it would mean a crate
      # is only linted on the pull request that changed it. A crate unchanged
      # since master's last green run cannot produce a new finding, which is the
      # argument for scoping it, but that argument depends on master staying green
      # and it was not worth trading a lint regression for.
      #
      # --workspace is named here rather than left to the root manifest. This step once read as workspace-wide and was not: with `default-members` set to a single crate and no selector on the command, it linted that crate alone and returned success. A lint denied by `.cargo/config.toml` in any of the other sixteen crates, including their test targets, could not fail this job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The runner cleans profile buffers through `cargo llvm-cov`, and the gate's
      # self-test carries a check group that reads the installed tool and skips
      # itself when the tool is absent. This job needs it even though it judges no
      # coverage: without it a cleaning path failed with `error: no such command:
      # llvm-cov`, which reads as a defect in the change rather than a missing
      # tool, and one check group skipped under a green run.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # No test step. The `scoped-coverage` job's instrumented run covers the
      # same packages and fails on any test failure, reporting the runner's error
      # code (3) rather than nextest's own. A plain pass here would duplicate it.

      # No doctest step. It cost 7 of the 11 minutes of a local full gate and ran
      # 0 tests: the workspace has two doc examples, both marked `ignore`.

      # The self-tests and the suites that live under `scripts/`. These files
      # decide what a gate reports and whether it reports at all: the wrapper
      # answers a repeated heavy command with a stored verdict, and the scoped
      # runner decides which packages this job measures. A wrong answer in
      # either lands on an unrelated check rather than on the thing that is
      # wrong.
      #
      # One step per suite, and `if: always()` on every one of them, because
      # `make` stops at the first failing command: a single step would report one
      # failure even when three suites are broken, and one broken suite would
      # hide the four behind it. The check list then shows one status per suite,
      # and a reader can see which one went red. `make scripts-check-ci-parity`
      # fails when this list and the prerequisites of the aggregate
      # `scripts-check` target in mk/scripts.mk differ.
      #
      # The two steps that already existed keep the names they had. The others
      # are new to this workflow: nothing on master ran them, and one
      # grouped step for all of them told a reader one thing about many suites.
      #
      # `span_verify.py` is not machinery: it is the reference span-grounding
      # check the extraction harness imports, and running it executes the
      # self-check in its own `__main__`. It is on this list because nothing
      # else ran it.

      # The wrapper's own tests. It answers with a stored exit code and a stored
      # log for a heavy command asked to run a second time on an unchanged tree,
      # and every tool in a checkout goes through it.
      - name: Gate self-test
        if: always()
        run: make scripts-check-gate

      # Whether a clippy run can quietly lint less than the file says it does.
      # The Clippy step above is the one this protects: it used to name no package
      # selector, so with a narrowed default selection it compiled one crate and
      # reported success. This step reads the Makefile, this workflow and the root
      # manifest, so the scope that step depends on is checked rather than assumed.
      - name: Lint scope check
        if: always()
        run: make scripts-check-lint-scope

      # The admission gate-boundary tripwires scan every crate, so they must run
      # on every change; `scripts-check-ci-parity` keeps this step in place.
      - name: Gate-boundary tripwires
        if: always()
        run: make scripts-check-gate-boundary

      # Whether a workflow installs the compiler the repository pins. The step
      # above the toolchain install already fails on a mismatch, but it runs on
      # the runner, so it answers after the push. This one answers before it.
      - name: Toolchain pin check
        if: always()
        run: make scripts-check-toolchain-pin

      - name: Span grounding self-check
        if: always()
        run: make scripts-check-span

      - name: Phase timer tests
        if: always()
        run: make scripts-check-phase-timer

      - name: Pre-commit runner tests
        if: always()
        run: make scripts-check-precommit

      # Whether the coverage surface can still measure one run and report it
      # once. The step in the scoped-coverage job is what this protects: its run is
      # split into a test step and a report step so the gate owns a boundary in
      # which to drop a profile buffer it cannot read and an instrumented binary
      # the run did not build, and its report step names a merge failure mode so
      # one malformed buffer costs its own coverage rather than the verdict every
      # passing test had earned. None of that is visible from a green run, so
      # removing any of it would leave this workflow reporting the same result.
      - name: Coverage surface check
        if: always()
        run: make scripts-check-coverage-surface

      # The scoped runner's own tests, including the source matcher that decides a
      # no-code file. It is the gate this job runs, so a break in its selection or
      # its judgement would land on every other check.
      - name: Scoped runner self-test
        if: always()
        run: make scripts-check-scoped-runner

      # Whether the tree still holds exactly one coverage rule. The Scoped
      # coverage step in `scoped-coverage` protects it: the four rules that were
      # not this one each arrived in a change about something else, and nothing
      # in the tree would have refused any of them. A lint over a closed list of
      # shapes, not a proof, and its own header says where it cannot see.
      - name: One coverage rule check
        if: always()
        run: make scripts-check-coverage-policy

      - name: Quick tool and schema check
        if: always()
        run: make scripts-check-quick

      - name: Gate installer check
        if: always()
        run: make scripts-check-gate-install

      - name: CI suite parity
        if: always()
        run: make scripts-check-ci-parity

      # Whether the Makefile's compose path still refuses to start the extract
      # service without its model. That path runs `docker compose` itself, so the
      # check inside the CLI does not run there, and the parity step above will
      # not notice a guard that stopped firing.
      - name: Compose extract-model guard
        if: always()
        run: make scripts-check-compose-model

      # Whether every changelog fragment is named and written to the rule, and
      # whether a change to product code carries one. The base is the same
      # scoped base the coverage job resolves, so the presence check judges
      # the same diff.
      - name: Changelog fragments check
        if: always()
        env:
          CHANGELOG_BASE: ${{ env.SCOPED_BASE }}
        run: make scripts-check-changelog

      # Whether prose stays one paragraph per line. Runs no build.
      - name: Prose check
        if: always()
        run: make scripts-check-prose

      # Whether a Rust source file mutates the process-global environment. Its
      # subject is every crate, like the gate-boundary tripwires, so it runs on
      # every change; a `set_var` in a test races every test beside it.
      - name: Env mutation check
        if: always()
        run: make scripts-check-env-mutation

      # The test lookup against the runner's real list. It builds the test
      # binaries itself, so it runs here directly, outside the suite targets.
      - name: Owned lookup acceptance
        if: always()
        run: python3 scripts/owned_tests.py --accept

      # Last, so it can report on whichever step failed: a test binary killed
      # from outside prints nothing, which is the case this was added for.
      - name: Out-of-memory check
        if: failure()
        run: dmesg --ctime 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true

  # The coverage judgement and the only scoped test run: `test-fast` is a
  # developer target, not a second job here. The report lands in
  # `target/coverage/coverage-scoped.json`, so the full-workspace report and a
  # targeted one can no longer overwrite each other.
  scoped-coverage:
    name: scoped coverage (≥80% lines on each changed Rust file)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clio
          POSTGRES_PASSWORD: clio
          POSTGRES_DB: clio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clio -d clio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same base resolution the check job uses: a detached checkout has no local
      # base branch for the bare name to resolve.
      - name: Resolve the diff base
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            echo "SCOPED_BASE=origin/$GITHUB_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "SCOPED_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
          echo "measuring against: ${GITHUB_BASE_REF:+$GITHUB_BASE_REF (remote form)}"

      # The same pin the other jobs use. Two jobs on different compilers would
      # give two different answers about the same tree.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Fail if the runner and the pin disagree
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::runner has rustc $actual but rust-toolchain.toml pins $pinned"
            exit 1
          fi
          echo "rustc $actual matches the pin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The coverage gate: every Rust file this change created or modified must
      # reach 80% of its lines. No other metric, no aggregate, and no per-file
      # recorded floor is compared anywhere.
      - name: Scoped coverage (≥80% lines on each changed Rust file)
        run: make coverage-fast BASE="$SCOPED_BASE"

      # The only test run a pull request makes, so its JUnit report is the one
      # the workflow publishes. nextest stores it under `target/nextest/<profile>`
      # in the workspace, not under the `target/llvm-cov-target` build directory.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      # Last, so it can report on whichever step failed: a test binary killed
      # from outside prints nothing, which is the case this was added for.
      - name: Out-of-memory check
        if: failure()
        run: dmesg --ctime 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true

