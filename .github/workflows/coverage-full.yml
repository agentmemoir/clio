# Whole-workspace coverage on the default branch, twice a day.
#
# GitHub starts scheduled workflows only on the default branch. GitHub disables
# scheduled workflows in a public repository after 60 days without repository
# activity.
name: coverage-full

on:
  schedule:
    - cron: "7 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: coverage-full
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CLIO_DATABASE_URL: postgres://clio:clio@127.0.0.1:5432/clio
  # One compiler at a time, the same cap as ci.yml: the instrumented build is
  # OOM-killed on a small runner otherwise.
  CARGO_BUILD_JOBS: "1"

jobs:
  coverage:
    name: whole workspace (80% lines on each file)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: clio
          POSTGRES_PASSWORD: clio
          POSTGRES_DB: clio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clio -d clio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    outputs:
      # Set only by the run step, after the coverage command has returned.
      finished: ${{ steps.run.outputs.finished }}
      verdict: ${{ steps.run.outputs.verdict }}
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # The same pin the other jobs use.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, llvm-tools-preview

      - name: Fail if the runner and the pin disagree
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::runner has rustc $actual but rust-toolchain.toml pins $pinned"
            exit 1
          fi
          echo "rustc $actual matches the pin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov

      # One instrumented run of the whole workspace: it is the test run and the
      # coverage run. The per-file line gate is checked below from the JSON report,
      # not passed to the tool. `finished` is written only after the command
      # returns, pass or fail, so a timeout or a cancel leaves it unset.
      - name: Whole-workspace coverage (80% lines on each file)
        id: run
        shell: bash
        run: |
          set +e
          set +o pipefail
          make coverage 2>&1 | tee "$RUNNER_TEMP/coverage.log"
          status=${PIPESTATUS[0]}
          report=target/coverage/coverage.json
          if [ "$status" -eq 0 ]; then
            if [ ! -s "$report" ]; then
              echo "::error::no coverage report was written, so the per-file 80% gate could not run"
              status=1
            elif ! jq -e '([.data[].files[]] | length) > 0' "$report" >/dev/null; then
              echo "::error::the coverage report has no file rows, so the per-file 80% gate could not run"
              status=1
            elif ! jq -e 'all(.data[].files[]; .summary.lines.percent >= 80)' "$report" >/dev/null; then
              echo "::error::a file is below 80% lines:"
              jq -r --arg root "$GITHUB_WORKSPACE/" '
                [.data[].files[] | select(.summary.lines.percent < 80)]
                | sort_by(.summary.lines.percent)
                | .[]
                | "\((.summary.lines.percent * 10 | floor) / 10)% (\(.summary.lines.covered)/\(.summary.lines.count) lines) \(.filename | ltrimstr($root))"
              ' "$report"
              status=1
            fi
          fi
          echo "finished=true" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            echo "verdict=pass" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      # Turns the run log and the report into the small files the report job reads.
      - name: Summarise the run for the report job
        if: always() && steps.run.outputs.finished == 'true'
        shell: bash
        run: |
          set +e
          set +o pipefail
          out="$RUNNER_TEMP/coverage-summary"
          mkdir -p "$out"
          printf '%s\n' "$GITHUB_SHA" > "$out/commit.txt"
          # nextest status lines: `<STATUS> [ <secs>s] [(<n>/<total>) ]<binary> <test>`.
          # Failing statuses: FAIL, FAIL + LEAK, LEAK-FAIL, TIMEOUT, SIG<name>, ABORT,
          # XFAIL. The optional counter differs between the live line and the final
          # summary line, so it is cut before the names are deduplicated.
          sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/coverage.log" \
            | grep -E '^ *(FAIL( \+ LEAK)?|LEAK-FAIL|TIMEOUT|SIG[A-Z0-9]+|ABORT( SIG [0-9]+)?|XFAIL) \[ *[0-9.]+s\] ' \
            | sed -E 's/^ *[^[]*\[ *[0-9.]+s\] (\([^)]*\) )?//' \
            | sort -u > "$out/failing-tests.txt"
          report=target/coverage/coverage.json
          if [ -s "$report" ]; then
            # The same boundary as the gate above: a file below 80% lines fails and
            # a file at exactly 80% passes. llvm-cov gives a file with no lines 0
            # percent. Rounded down, so a failing file never prints as 80.0%.
            jq -r --arg root "$GITHUB_WORKSPACE/" '
              [.data[].files[] | select(.summary.lines.percent < 80)]
              | sort_by(.summary.lines.percent)
              | .[]
              | "\((.summary.lines.percent * 10 | floor) / 10)% (\(.summary.lines.covered)/\(.summary.lines.count) lines) \(.filename | ltrimstr($root))"
            ' "$report" > "$out/low-files.txt"
          else
            : > "$out/low-files.txt"
            echo "::warning::no coverage report was written"
          fi
          echo "failing tests: $(wc -l < "$out/failing-tests.txt"); files below 80%: $(wc -l < "$out/low-files.txt")"

      - name: Upload the run summary
        if: always() && steps.run.outputs.finished == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage-summary

      # Last, so it can report on whichever step failed: a test binary killed
      # from outside prints nothing. The same check as ci.yml.
      - name: Out-of-memory check
        if: failure()
        run: dmesg --ctime 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true

  # One open issue, labelled coverage-full, holds the result of these runs.
  report:
    name: report the result
    needs: coverage
    if: always() && needs.coverage.outputs.finished == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Download the run summary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Record the result on the open coverage issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ needs.coverage.outputs.verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          dir=coverage-summary
          sha=$(cat "$dir/commit.txt")
          # The oldest open issue, if one exists. Scheduled runs queue, so one run acts at a time.
          issue=$(gh issue list -R "$REPO" --label coverage-full --state open --limit 100 \
            --json number --jq 'sort_by(.number) | .[0].number // empty')

          if [ "$VERDICT" = "pass" ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" -R "$REPO" \
                --body "The full workspace coverage suite is green at $sha. Run: $RUN_URL"
              gh issue close "$issue" -R "$REPO"
            fi
            exit 0
          fi

          body="$RUNNER_TEMP/coverage-body.md"
          {
            printf 'Run: %s\n\nCommit: %s\n\nFailing tests:\n' "$RUN_URL" "$sha"
            if [ -s "$dir/failing-tests.txt" ]; then
              sed 's/^/- /' "$dir/failing-tests.txt"
            else
              echo '- none named in the run log'
            fi
            printf '\nFiles below 80%% lines (a file at exactly 80%% passes):\n'
            if [ -s "$dir/low-files.txt" ]; then
              head -n 200 "$dir/low-files.txt" | sed 's/^/- /'
              total=$(wc -l < "$dir/low-files.txt")
              if [ "$total" -gt 200 ]; then
                echo "- and $((total - 200)) more, in the coverage-summary artifact of the run"
              fi
            else
              echo '- none listed'
            fi
            if [ ! -s "$dir/failing-tests.txt" ] && [ ! -s "$dir/low-files.txt" ]; then
              printf '\nNo test or file is named, so the run failed for another reason. The run log has the error.\n'
            fi
            printf '\nThe failing tests and the files above must be fixed.\n'
          } > "$body"

          if [ -z "$issue" ]; then
            gh issue create -R "$REPO" --title "Full workspace coverage suite failed on master" \
              --label coverage-full --label bug --label area:tooling --label difficulty:medium \
              --body-file "$body"
            exit 0
          fi
          last=$(gh issue view "$issue" -R "$REPO" --json comments --jq '.comments | last | .body // ""')
          if [[ "$last" == *"$sha"* ]]; then
            echo "The latest comment on the open issue already names $sha."
          else
            gh issue comment "$issue" -R "$REPO" --body-file "$body"
          fi
