# CodeQL code scanning, advanced setup.
#
# This file replaces the repository's default setup, whose dynamic workflow
# (`dynamic/github-code-scanning/codeql`) started an analysis for every pull
# request commit no matter what the pull request changed: on the runs recorded
# 2026-10-20 its Rust job alone took 282 to 481 s (mean 412 s over ten runs),
# beside the 232 to 392 s CI job it duplicated on non-Rust changes.
#
#
# Default setup is not configured in this repository (state=not-configured),
# so analyses run from this workflow on the daily schedule below and on
# manual dispatch only.
name: CodeQL

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mode: none needs rustup and cargo, which the GitHub-hosted
      # ubuntu image ships, so there is no toolchain install here. The
      # repository's own pin check covers ci.yml, not this file, and CodeQL
      # builds a database without invoking a full build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:rust'