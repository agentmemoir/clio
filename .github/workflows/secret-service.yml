# The Linux Secret Service round trip, in a workflow of its own.
#
# It used to be the `linux-secret-service` job inside `ci.yml`, with every step
# unchanged. The trigger filter below is a copy of `ci.yml`'s, because a job
# runs only from the file that owns it. This is the one place the store this
# build ships installs, writes, reads, and deletes against a real
# `org.freedesktop.secrets`, on a private session bus that `dbus-run-session`
# starts for the test.
name: secret service round trip

on:
  push:
    branches: [master, main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  CLIO_DATABASE_URL: postgres://clio:clio@127.0.0.1:5432/clio
  # Build parallelism, capped so the gate survives a small runner.
  #
  # A single rustc peaks around 386MB RSS on this workspace, so cargo's default of
  # one compiler per core needs roughly 772MB on a 2-core runner and gets
  # OOM-killed partway through the instrumented build. One compiler at a time
  # fits. The wall-clock cost is bounded because the instrumented build is cached
  # between runs, so only changed crates are recompiled.
  CARGO_BUILD_JOBS: "1"

permissions:
  contents: read

jobs:
  # The Linux Secret Service store is the one platform arm whose backend is a
  # service, and no other job provides one. On a bare runner `Store::new()`
  # finds no session bus, every Linux-gated test takes its accept-the-failure
  # path, and a green run says nothing about whether the store works. This job
  # is the only place the store this build ships installs, writes, reads, and
  # deletes against a real `org.freedesktop.secrets`.
  #
  # It runs one test. The round trip is behind the `linux-secret-service-test`
  # feature, and the test is named on the command line so no sibling test's
  # store can answer in the real one's place. This is not the only job that
  # compiles the file: the `check` job lints the workspace with every target
  # and feature on ubuntu-latest under `-D warnings`, so the file is linted
  # and type-checked even if this job is skipped. That job does not run the
  # test, so nothing points a live store at a bare runner.
  #
  # The packages: `dbus-daemon` owns `dbus-run-session`, `dbus-bin` owns
  # `dbus-send` for the readiness wait below, and `dbus-session-bus-common`
  # carries the session bus configuration and service files the private bus
  # reads. `gnome-keyring` owns `gnome-keyring-daemon` and the
  # `org.freedesktop.secrets` service file. `dbus-x11` is not needed, because
  # the bus comes from `dbus-run-session` rather than `dbus-launch`.
  linux-secret-service:
    name: secret service round trip (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install a session bus and a Secret Service
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          # apt does not bound the wait it hands to the resolver, and the runner
          # image already names three mirror hosts and its own socket timeouts,
          # so this caps the whole command with `timeout` instead of overriding
          # either one, and retries once.
          install_packages() {
            sudo timeout 90 apt-get update &&
              sudo timeout 120 apt-get install -y --no-install-recommends \
                dbus-daemon dbus-bin dbus-session-bus-common gnome-keyring
          }

          for attempt in 1 2; do
            if install_packages; then
              exit 0
            fi
            echo "attempt $attempt: the apt-get install did not finish inside its cap, retrying" >&2
            sleep $((attempt * 5))
          done

          echo "the apt-get install failed twice, so no session bus or Secret Service is installed" >&2
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `dbus-run-session` starts a private session bus, exports
      # `DBUS_SESSION_BUS_ADDRESS` to the command it runs, and takes the bus
      # down when that command exits, so the daemon and the test share one bus
      # and no address is carried between steps.
      #
      # `gnome-keyring-daemon --unlock` reads a password from stdin and unlocks
      # the login keyring, creating it when it does not exist, so an empty
      # password is the whole setup: the collection this store's default target
      # names ends up present and unlocked. `--components=secrets` starts only
      # the Secret Service component, and `--daemonize` returns the step's shell
      # instead of holding it open for the daemon's lifetime.
      #
      # The readiness wait is bounded and it fails the step. The test itself
      # neither polls nor sleeps: its only bound is the receive timeout on the
      # round trip, and it fails rather than skips when no store answers.
      - name: Secret Service round trip
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "\n" | setsid gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null 2>&1
            ready=0
            for _ in $(seq 150); do
              if dbus-send --session --print-reply --dest=org.freedesktop.DBus \
                /org/freedesktop/DBus org.freedesktop.DBus.NameHasOwner \
                string:org.freedesktop.secrets 2>/dev/null | grep -q "boolean true"; then
                alias_reply=$(dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets org.freedesktop.Secret.Service.ReadAlias string:default 2>/dev/null || true)
                printf "%s" "$alias_reply" | grep -q "object path \"/org/" || continue
                ready=1
                break
              fi
              sleep 0.2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::org.freedesktop.secrets never appeared on the session bus with a default collection, so gnome-keyring-daemon did not start"
              exit 1
            fi
            cargo test -p clio-config --locked --features linux-secret-service-test --lib -- \
              secret_key_store_platform::live_tests::a_secret_round_trips_through_the_secret_service_store --exact
          '

      - name: Out-of-memory check
        if: failure()
        run: dmesg --ctime 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true
