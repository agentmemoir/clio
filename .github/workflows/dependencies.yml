name: Dependency policy

on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  push:
    branches: [master]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/dependencies.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.1
      - name: Check advisories, licenses, bans and sources
        id: deny
        run: cargo deny --locked check advisories licenses bans sources
      - name: Audit the lockfile against RustSec
        id: audit
        if: ${{ !cancelled() }}
        run: cargo audit --file Cargo.lock
      - name: Report scan results
        if: ${{ !cancelled() }}
        env:
          DENY_OUTCOME: ${{ steps.deny.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Dependency policy'
            echo "cargo-deny: $DENY_OUTCOME"
            echo "cargo-audit: $AUDIT_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DENY_OUTCOME" = failure ] || [ "$AUDIT_OUTCOME" = failure ]; then
            echo '::warning::Dependency scan failed. Read the scan logs for findings or scan errors.'
          fi
