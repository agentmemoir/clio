# The scoped coverage gate, in a workflow of its own.
#
# It used to be the `scoped-coverage` job inside `ci.yml`, with every step
# unchanged. The trigger filter below is a copy of `ci.yml`'s, because a job
# runs only from the file that owns it. The gate is `scripts/scoped_runner.py`
# through `make coverage-fast`, and its report still lands in
# `target/coverage/coverage-scoped.json`.
name: scoped coverage

on:
  push:
    branches: [master, main]
    # This list is identical in all three workflow files and must stay that way.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scoped-coverage.yml'
      - '.github/workflows/secret-service.yml'
  pull_request:
    branches: [master, main]
    # This list is identical in all three workflow files and must stay that way.
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'sql/**'
      - 'Makefile'
      - 'mk/**'
      - 'scripts/**'
      - 'hooks.d/**'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - 'changelog.d/**'
      - 'CHANGELOG.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/scoped-coverage.yml'
      - '.github/workflows/secret-service.yml'

env:
  CARGO_TERM_COLOR: always
  CLIO_DATABASE_URL: postgres://clio:clio@127.0.0.1:5432/clio
  # Build parallelism, capped so the gate survives a small runner.
  #
  # A single rustc peaks around 386MB RSS on this workspace, so cargo's default of
  # one compiler per core needs roughly 772MB on a 2-core runner and gets
  # OOM-killed partway through the instrumented build. One compiler at a time
  # fits. The wall-clock cost is bounded because the instrumented build is cached
  # between runs, so only changed crates are recompiled.
  CARGO_BUILD_JOBS: "1"

permissions:
  contents: read

jobs:
  # The coverage judgement and the only scoped test run: `test-fast` is a
  # developer target, not a second job here. The report lands in
  # `target/coverage/coverage-scoped.json`, so the full-workspace report and a
  # targeted one can no longer overwrite each other.
  scoped-coverage:
    name: scoped coverage (≥80% lines on each changed Rust file)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: clio
          POSTGRES_PASSWORD: clio
          POSTGRES_DB: clio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clio -d clio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Mount temporary storage
        run: |
          sudo mkdir -p /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /mnt/noexec
          sudo mount -t tmpfs -o noexec,nosuid,nodev,mode=1777 tmpfs /dev/shm
          echo "TMPDIR=/mnt/noexec" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Same base resolution the check job uses: a detached checkout has no local
      # base branch for the bare name to resolve.
      - name: Resolve the diff base
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            echo "SCOPED_BASE=origin/$GITHUB_BASE_REF" >> "$GITHUB_ENV"
          else
            echo "SCOPED_BASE=HEAD~1" >> "$GITHUB_ENV"
          fi
          echo "measuring against: ${GITHUB_BASE_REF:+$GITHUB_BASE_REF (remote form)}"

      # The same pin the other jobs use. Two jobs on different compilers would
      # give two different answers about the same tree.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, llvm-tools-preview

      - name: Fail if the runner and the pin disagree
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          if [ "$pinned" != "$actual" ]; then
            echo "::error::runner has rustc $actual but rust-toolchain.toml pins $pinned"
            exit 1
          fi
          echo "rustc $actual matches the pin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install nextest
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-llvm-cov

      # The coverage gate: every Rust file this change created or modified must
      # reach 80% of its lines. No other metric, no aggregate, and no per-file
      # recorded floor is compared anywhere.
      - name: Scoped coverage (≥80% lines on each changed Rust file)
        id: scoped_coverage
        run: make coverage-fast BASE="$SCOPED_BASE"

      # The only test run a pull request makes, so its JUnit report is the one
      # the workflow publishes. nextest stores it under `target/nextest/<profile>`
      # in the workspace, not under the `target/llvm-cov-target` build directory.
      #
      # A change that touches no Rust file selects no test, so the runner runs
      # no test and writes no report, and there is nothing to publish. The
      # upload used to fail on that, because `if-no-files-found: error` reads a
      # missing report as a broken run, and the report was missing because no
      # run had happened. The report and the gate's own report are the two
      # things a test run leaves behind, so their presence is what says a run
      # happened: the JUnit report when the run wrote it, the coverage report
      # when the run finished and the merge wrote it. A run that wrote the
      # coverage report but no JUnit report still fails the job, because the
      # upload runs on the coverage report alone and finds no JUnit file to
      # publish. A run that wrote neither report selected no test, so the
      # upload is skipped and the job stays green.
      - name: Upload test report
        if: >-
          always()
          && steps.scoped_coverage.outcome != 'skipped'
          && (hashFiles('target/nextest/ci/junit.xml') != ''
          || hashFiles('target/coverage/coverage-scoped.json') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error

      # Last, so it can report on whichever step failed: a test binary killed
      # from outside prints nothing, which is the case this was added for.
      - name: Out-of-memory check
        if: failure()
        run: dmesg --ctime 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true
